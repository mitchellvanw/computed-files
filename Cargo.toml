[package]
name = "computed"
version = "0.1.0"
edition = "2021"
description = "Keeps marked regions of a markdown file current by computation"
license = "MIT"
repository = "https://github.com/mitchellvanw/computed-files"
homepage = "https://mitchellvanw.github.io/computed-files/"
documentation = "https://mitchellvanw.github.io/computed-files/how-it-works.html"
readme = "README.md"
keywords = ["markdown", "documentation", "codegen", "pre-commit", "cli"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
exclude = [".scratch/", "prototypes/", "docs/research/", ".github/", ".claude-plugin/", "skills/"]

[lib]
name = "computed"
path = "src/lib.rs"

[[bin]]
name = "computed"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
globset = "0.4.20"
ignore = "0.4.33"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
similar = "3.2.0"
tempfile = "3.27.0"
toml = "1.1.5"
wait-timeout = "0.2.1"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
