name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Archive
        run: |
          set -eu
          dir="computed-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/computed" README.md LICENSE-MIT "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          if command -v sha256sum >/dev/null; then
            sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
          else
            shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  # Publishes the tagged version to crates.io by trusted publishing, with no
  # stored token: crates.io's settings for the crate name this repository and
  # `release.yml` (https://crates.io/docs/trusted-publishing). A tag that is
  # not `v` plus Cargo.toml's version stops here, before anything is public.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches Cargo.toml
        run: |
          set -eu
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME is not v$v, the version in Cargo.toml" >&2
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # The GitHub release follows the crates.io publish, so the release page and
  # the site never announce a version `cargo install` cannot fetch.
  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Collect sums
        run: |
          set -eu
          cat dist/*.tar.gz.sha256 > dist/SHA256SUMS
          rm dist/*.tar.gz.sha256
          cat dist/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes dist/*
