[package]
name = "computed"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Keeps marked regions of a markdown file current by computation"
license = "MIT"
repository = "https://github.com/mitchellvanw/computed-files"
homepage = "https://mitchellvanw.github.io/computed-files/"
documentation = "https://mitchellvanw.github.io/computed-files/how-it-works.html"
readme = "README.md"
keywords = ["markdown", "documentation", "codegen", "pre-commit", "cli"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
exclude = [".scratch/", "prototypes/", "docs/research/", ".github/", ".claude-plugin/", "claude-code-plugin/"]

[lib]
name = "computed"
path = "src/lib.rs"

[[bin]]
name = "computed"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
csv = "1.4.0"
globset = "0.4.20"
ignore = "0.4.33"
libc = "0.2.189"
lsp-server = "0.10"
lsp-types = "0.97"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
similar = "3.2.0"
tempfile = "3.27.0"
toml = "1.1.5"
wait-timeout = "0.2.1"
yaml-rust2 = { version = "0.13.0", default-features = false }

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
